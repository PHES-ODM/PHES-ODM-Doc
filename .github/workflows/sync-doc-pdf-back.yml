name: Sync rendered PDF back to PHES-ODM

# Reciprocal half of PHES-ODM/PHES-ODM's sync-doc-repo.yml: once a rendered
# docs/ODM-documentation-v<version>.pdf lands on main here (normally because
# that workflow's PR -- swap in a new dictionary snapshot, bump the doc
# version, render -- was reviewed and merged), copies it into
# PHES-ODM/PHES-ODM's doc-source/ and opens a PR there.
#
# Needs a CROSS_REPO_TOKEN secret in THIS repo: a fine-grained PAT with
# Contents + Pull requests write access to PHES-ODM/PHES-ODM. The
# workflow's own GITHUB_TOKEN cannot push to a different repository at
# all, so nothing here runs until that secret exists. (A separate
# CROSS_REPO_TOKEN, scoped the other way, lives in PHES-ODM for
# sync-doc-repo.yml -- the two are not the same secret.)
#
# This never attempts to re-render anything itself -- the PDF it pushes is
# whatever was actually committed to docs/ on main, produced by whichever
# human-reviewed process put it there.

on:
  push:
    branches: [main]
    paths:
      - "docs/ODM-documentation-v*.pdf"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PHES-ODM-Doc
        uses: actions/checkout@v4

      - name: Determine the current rendered PDF
        id: pdf
        run: |
          set -euo pipefail
          MATCHES=(docs/ODM-documentation-v*.pdf)
          if [ ! -e "${MATCHES[0]}" ]; then
            echo "No docs/ODM-documentation-v*.pdf found -- nothing to sync." >&2
            exit 1
          fi
          if [ "${#MATCHES[@]}" -gt 1 ]; then
            echo "::warning::Multiple docs/ODM-documentation-v*.pdf files found (${MATCHES[*]}); using the first. Only one should be committed at a time."
          fi
          PDF="${MATCHES[0]}"
          NAME=$(basename "$PDF")
          VERSION=$(echo "$NAME" | sed -E 's/ODM-documentation-v(.+)\.pdf/\1/')
          echo "pdf=$PDF" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Checkout PHES-ODM
        uses: actions/checkout@v4
        with:
          repository: PHES-ODM/PHES-ODM
          token: ${{ secrets.CROSS_REPO_TOKEN }}
          path: phes-odm

      - name: Check whether a sync is needed
        id: check
        run: |
          set -euo pipefail
          if [ -f "phes-odm/doc-source/${{ steps.pdf.outputs.name }}" ]; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
            echo "PHES-ODM already has doc-source/${{ steps.pdf.outputs.name }} -- nothing to sync."
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Swap in the new documentation PDF
        if: steps.check.outputs.needed == 'true'
        run: |
          set -euo pipefail
          rm -f phes-odm/doc-source/ODM-documentation-v*.pdf
          cp "${{ steps.pdf.outputs.pdf }}" "phes-odm/doc-source/${{ steps.pdf.outputs.name }}"

      - name: Open PR in PHES-ODM
        if: steps.check.outputs.needed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.CROSS_REPO_TOKEN }}
          path: phes-odm
          commit-message: "Sync rendered documentation PDF to v${{ steps.pdf.outputs.version }}"
          title: "Sync rendered documentation PDF to v${{ steps.pdf.outputs.version }}"
          body: |
            Auto-generated by PHES-ODM/PHES-ODM-Doc's `sync-doc-pdf-back.yml`
            after `docs/${{ steps.pdf.outputs.name }}` was committed to `main`
            there.

            Swapped in `doc-source/${{ steps.pdf.outputs.name }}`, removing the
            old versioned PDF.
          branch: auto/sync-documentation-pdf
          delete-branch: true
          add-paths: doc-source/ODM-documentation-v*.pdf
